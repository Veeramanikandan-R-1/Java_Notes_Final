    <text x="295" y="358" fill="#f6f9ff" font-family="Arial,sans-serif" font-size="29">Libraries + JVM</text>
    <path d="M445 400v45" stroke="url(#accent)" stroke-width="4"/>
    <path d="m433 434 12 14 12-14" fill="none" stroke="#51e0d0" stroke-width="4"/>
