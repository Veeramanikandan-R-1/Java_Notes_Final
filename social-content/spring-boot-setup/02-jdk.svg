    <rect x="54" y="125" width="790" height="104" rx="22" fill="#15314c"/>
    <text x="90" y="191" fill="#55dccc" font-family="Arial,sans-serif" font-size="34" font-weight="700">JDK</text>
    <text x="245" y="191" fill="#f6f9ff" font-family="Arial,sans-serif" font-size="30">Developer tools + Java runtime</text>
    <path d="M445 238v48" stroke="url(#accent)" stroke-width="4"/>
    <path d="m433 275 12 14 12-14" fill="none" stroke="#51e0d0" stroke-width="4"/>
