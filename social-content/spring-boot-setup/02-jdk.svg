  <text x="135" y="1500" fill="#8df0df" font-family="monospace" font-size="34">javac -version</text>
  <text x="95" y="1615" fill="#b8c8dc" font-family="Arial,sans-serif" font-size="30">Also set <tspan fill="#76eee1" font-weight="700">JAVA_HOME</tspan> to your JDK folder.</text>
