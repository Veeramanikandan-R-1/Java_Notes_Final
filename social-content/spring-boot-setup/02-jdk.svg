  <text x="90" y="170" fill="#76eee1" font-family="Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="3">02 / THE FOUNDATION</text>
  <text x="90" y="365" fill="#f6f9ff" font-family="Arial,sans-serif" font-size="92" font-weight="800">Install JDK 21</text>
  <text x="95" y="455" fill="#b8c8dc" font-family="Arial,sans-serif" font-size="36">Your toolkit for building Java apps.</text>
