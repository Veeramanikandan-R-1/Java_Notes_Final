<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081226"/><stop offset="1" stop-color="#102b4c"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#51e0d0"/><stop offset="1" stop-color="#54a8ff"/></linearGradient></defs>
  <rect width="1080" height="1920" fill="url(#bg)"/><circle cx="920" cy="250" r="300" fill="#1c4771" opacity=".2"/>
  <text x="90" y="170" fill="#76eee1" font-family="Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="3">05 / BUILD &amp; DEPENDENCIES</text>
  <text x="90" y="365" fill="#f6f9ff" font-family="Arial,sans-serif" font-size="92" font-weight="800">Meet Maven</text>
  <text x="95" y="455" fill="#b8c8dc" font-family="Arial,sans-serif" font-size="36">It helps build your app and manage libraries.</text>
  <g transform="translate(90 570)">
    <rect width="900" height="250" rx="36" fill="#10213a" stroke="#284565" stroke-width="2"/>
    <text x="50" y="75" fill="#9cb4d1" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="2">PROJECT CONFIGURATION</text>
    <rect x="50" y="108" width="800" height="98" rx="22" fill="#050d1a"/>
    <text x="88" y="172" fill="#f6f9ff" font-family="monospace" font-size="38">&lt;project&gt;  ...  &lt;/project&gt;</text>
    <text x="50" y="232" fill="#76eee1" font-family="Arial,sans-serif" font-size="26">pom.xml tells Maven about your project + dependencies.</text>
  </g>
  <text x="95" y="940" fill="#f6f9ff" font-family="Arial,sans-serif" font-size="33" font-weight="700">Run a Maven command</text>
  <rect x="90" y="990" width="900" height="190" rx="30" fill="#050d1a" stroke="#284565" stroke-width="2"/>
  <circle cx="130" cy="1040" r="8" fill="#51e0d0"/><circle cx="160" cy="1040" r="8" fill="#54a8ff"/><circle cx="190" cy="1040" r="8" fill="#f1bd68"/>
  <text x="135" y="1120" fill="#8df0df" font-family="monospace" font-size="38">mvn spring-boot:run</text>
  <text x="95" y="1270" fill="#f6f9ff" font-family="Arial,sans-serif" font-size="31" font-weight="700">No separate Maven install?</text>
  <text x="95" y="1335" fill="#b8c8dc" font-family="Arial,sans-serif" font-size="29">
    <tspan x="95" dy="0">Many Spring projects include the Maven Wrapper</tspan>
    <tspan x="95" dy="46">— use </tspan><tspan fill="#76eee1" font-family="monospace">./mvnw</tspan><tspan> (or </tspan><tspan fill="#76eee1" font-family="monospace">mvnw.cmd</tspan><tspan> on Windows).</tspan>
  </text>
  <g transform="translate(90 1515)">
    <rect width="900" height="135" rx="28" fill="#123b52"/>
    <text x="42" y="58" fill="#76eee1" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="2">REMEMBER</text>
    <text x="42" y="105" fill="#f6f9ff" font-family="Arial,sans-serif" font-size="30">Maven = build tool + dependency manager</text>
  </g>
  <text x="90" y="1780" fill="#8ba2bd" font-family="Arial,sans-serif" font-size="25">JAVA • SPRING BOOT SETUP</text><text x="990" y="1780" text-anchor="end" fill="#8ba2bd" font-family="Arial,sans-serif" font-size="25">05 / 06</text>
</svg>
